<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taksi Hesap</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0d10;color:#f4f5f7;padding:20px}main{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:28px;font-weight:900}.muted{color:#9ba3af}.panel{background:#141820;border:1px solid #29303b;border-radius:18px;padding:20px;margin-bottom:16px}label{display:block;color:#aeb6c2;font-size:13px;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #343d4b;border-radius:10px;background:#0d1117;color:#fff;font-size:16px}button{border:0;border-radius:10px;padding:12px 16px;background:#e7b85b;color:#16120a;font-weight:800;cursor:pointer}button.alt{background:#29313d;color:#fff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.days{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.days button{background:#29313d;color:white}.days button.active{background:#e7b85b;color:#16120a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.day h3{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px;padding-top:14px;border-top:1px solid #303744}.clean{color:#75e0a2;font-size:24px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#0d1117;border-radius:12px;padding:15px}.stat b{display:block;font-size:22px;margin-top:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.controls,.fields{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="top"><div><div class="brand">🚕 Taksi Hesap</div><div class="muted">Günlük kazanç ve temiz para takip sistemi</div></div><button class="alt" onclick="resetAll()">Sıfırla</button></div><section class="panel"><h2>Hesap dönemi</h2><div class="controls"><div><label>Kaç gün hesaplanacak?</label><select id="count" onchange="render()"><option value="1">1 Gün</option><option value="2">2 Gün</option><option value="3">3 Gün</option><option value="4">4 Gün</option><option value="5">5 Gün</option><option value="6">6 Gün</option><option value="7" selected>7 Gün</option></select></div><div><label>Hesap adı</label><input id="name" placeholder="Örn. Eylül 3. hafta" oninput="save()"></div></div></section><div id="days" class="grid"></div><section class="panel"><h2>Genel özet</h2><div id="summary" class="summary"></div><div class="actions"><button onclick="window.print()">Yazdır / PDF kaydet</button><button class="alt" onclick="save();alert('Bilgiler bu tarayıcıya kaydedildi.')">Kaydet</button></div></section></main><script>const key='taksiHesapV1';let data=JSON.parse(localStorage.getItem(key)||'{}');const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);function save(){data.name=document.getElementById('name').value;data.count=document.getElementById('count').value;data.days=data.days||{};document.querySelectorAll('[data-day]').forEach(el=>{let d=el.dataset.day;data.days[d]={};el.querySelectorAll('input').forEach(i=>data.days[d][i.dataset.field]=i.value)});localStorage.setItem(key,JSON.stringify(data));summary()}function val(d,f){return data.days?.[d]?.[f]||''}function render(){let count=+document.getElementById('count').value;let wrap=document.getElementById('days');wrap.innerHTML='';for(let d=1;d<=count;d++){let el=document.createElement('section');el.className='panel day';el.dataset.day=d;el.innerHTML=`<h3>📅 ${d}. Gün</h3><div class="fields">${field(d,'income','Toplam kazanç (TL)')} ${field(d,'commission','Komisyon (TL)')} ${field(d,'fuel','Benzin (TL)')} ${field(d,'other','Diğer masraflar (TL)')}</div><div class="result"><span class="muted">Günün temiz parası</span><span class="clean" id="clean${d}">₺0,00</span></div>`;wrap.appendChild(el);el.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{save();calcDay(d)}));calcDay(d)}summary()}function field(d,f,label){return `<div><label>${label}</label><input type="number" min="0" step="0.01" data-field="${f}" value="${val(d,f)}" placeholder="0"></div>`}function calcDay(d){let x=data.days?.[d]||{};let n=f=>Number(x[f])||0;let clean=n('income')-n('commission')-n('fuel')-n('other');let el=document.getElementById('clean'+d);if(el)el.textContent=money(clean)}function summary(){let count=+document.getElementById('count').value||7,total=0,com=0,fuel=0,other=0,clean=0;for(let d=1;d<=count;d++){let x=data.days?.[d]||{},n=f=>Number(x[f])||0;total+=n('income');com+=n('commission');fuel+=n('fuel');other+=n('other');clean+=n('income')-n('commission')-n('fuel')-n('other')}document.getElementById('summary').innerHTML=[['Toplam kazanç',total],['Toplam komisyon',com],['Toplam benzin',fuel],['Diğer masraflar',other],['TEMİZ PARA',clean]].map(([a,b])=>`<div class="stat"><span class="muted">${a}</span><b>${money(b)}</b></div>`).join('')}function resetAll(){if(confirm('Tüm kayıtlar silinsin mi?')){localStorage.removeItem(key);data={};location.reload()}}document.getElementById('name').value=data.name||'';document.getElementById('count').value=data.count||7;render();</script></body></html>
