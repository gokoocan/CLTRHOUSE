<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLTR Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="cltr-music">

        <div class="music-title">
            <span>03 / MUSIC</span>

            <h1>
                CLTR <b>PLAYER</b>
            </h1>

            <p>
                CLTR topluluğunun seçtiği parçalar.
            </p>
        </div>


        <!-- PLAYER -->

        <div class="player">

            <div class="player-song">

                <div class="disc">
                    CLTR
                </div>

                <div class="song-details">

                    <small>NOW PLAYING</small>

                    <h2 id="songTitle">
                        CLTR TRACK 01
                    </h2>

                    <p id="songArtist">
                        CLTR COMMUNITY
                    </p>

                </div>

            </div>


            <!-- KONTROLLER -->

            <div class="controls">

                <button id="prev">
                    ‹
                </button>

                <button
                    id="play"
                    class="play"
                >
                    ▶
                </button>

                <button id="next">
                    ›
                </button>

            </div>


            <!-- SÜRE -->

            <div class="progress-container">

                <span id="current">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="total">
                    0:00
                </span>

            </div>


            <!-- SES -->

            <div class="volume">

                <span>VOL</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >

                <span id="volumeNumber">
                    80%
                </span>

            </div>

        </div>


        <!-- ŞARKILAR -->

        <div class="songs">

            <button
                class="song active"
                data-song="0"
            >
                <span>01</span>
                <strong>CLTR TRACK 01</strong>
                <small>PLAY</small>
            </button>


            <button
                class="song"
                data-song="1"
            >
                <span>02</span>
                <strong>CLTR TRACK 02</strong>
                <small>PLAY</small>
            </button>


            <button
                class="song"
                data-song="2"
            >
                <span>03</span>
                <strong>CLTR TRACK 03</strong>
                <small>PLAY</small>
            </button>

        </div>

    </section>


    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>
</html>
